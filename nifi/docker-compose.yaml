services:
  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi-kafka
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminadminadmin1
      NIFI_JVM_HEAP_INIT: 256m
      NIFI_JVM_HEAP_MAX: 768m
    volumes:
      - ./yandex-truststore.jks:/opt/nifi/certs/truststore.jks:ro
