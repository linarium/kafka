startDelaySeconds: 0
ssl: false
lowercaseOutputName: false
lowercaseOutputLabelNames: false

rules:
  - pattern: "kafka.connect<type=connect-worker-metrics>([^:]+):"
    name: "kafka_connect_worker_metrics_$1"

  - pattern: "kafka.connect<type=connect-metrics, client-id=([^:]+)><>([^:]+)"
    name: "kafka_connect_metrics_$2"
    labels:
      client: "$1"

  - pattern: "kafka.connect<type=connector-metrics, connector=([^,]+)><>([^:]+)"
    name: "kafka_connect_connector_metrics_$2"
    labels:
      connector: "$1"

  - pattern: "kafka.connect<type=connector-task-metrics, connector=([^,]+), task=([^>]+)><>([^:]+)"
    name: "kafka_connect_connector_task_metrics_$3"
    labels:
      connector: "$1"
      task: "$2"

  - pattern: "kafka.connect<type=source-task-metrics, connector=([^,]+), task=([^>]+)><>([^:]+)"
    name: "kafka_connect_source_task_metrics_$3"
    labels:
      connector: "$1"
      task: "$2"

  - pattern: "kafka.connect<type=task-error-metrics, connector=([^,]+), task=([^>]+)><>([^:]+)"
    name: "kafka_connect_task_error_metrics_$3"
    labels:
      connector: "$1"
      task: "$2"

  - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^,]+), key=([^>]+)><>RowsScanned"
    name: "debezium_metrics_RowsScanned"
    labels:
      plugin: "$1"
      name: "$3"
      context: "$2"
      table: "$4"

  - pattern: "debezium.([^:]+)<type=connector-metrics, server=([^,]+), task=([^,]+), context=([^,]+), database=([^>]+)>([^:]+)"
    name: "debezium_metrics_$6"
    labels:
      plugin: "$1"
      name: "$2"
      task: "$3"
      context: "$4"
      database: "$5"

  - pattern: "debezium.([^:]+)<type=connector-metrics, server=([^,]+), task=([^,]+), context=([^>]+)>([^:]+)"
    name: "debezium_metrics_$5"
    labels:
      plugin: "$1"
      name: "$2"
      task: "$3"
      context: "$4"

  - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)>([^:]+)"
    name: "debezium_metrics_$4"
    labels:
      plugin: "$1"
      name: "$3"
      context: "$2"
